<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Analyst</title>
    <link rel="stylesheet" href="chatbot.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <!-- 🌟 เพิ่มคลาส expanded เข้าไปตรงนี้ เพื่อให้เปิดมาเต็มจอตั้งแต่เริ่ม -->
    <div class="ai-sidebar is-empty expanded">
        
        <!-- Header -->
        <div class="ai-header">
            <div class="header-profile">
                <div class="header-avatar"></div>
                <div class="header-info">
                    <div class="bot-name">AI Analyst</div>
                    <div class="bot-status"><span class="status-dot"></span> Online</div>
                </div>
            </div>
            
            <div class="header-actions">
                <!-- 🌟 เพิ่มปุ่มเริ่มแชทใหม่ตรงนี้ -->
                <button id="newChatBtn" class="header-btn" title="เริ่มแชทใหม่">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                </button>
                <button id="expandBtn" class="header-btn" title="ย่อหน้าจอ">
                    <svg id="expandIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 14h6v6M20 10h-6V4M14 10l7-7M10 14l-7 7"/>
                    </svg>
                </button>
                <span class="close-icon" title="ปิดแชท">✕</span>
            </div>
        </div>

        <!-- ประวัติการแชท -->
        <div class="chat-history" id="chatHistory">
            <div class="message-wrapper bot">
                <div class="message-avatar"></div>
                <div class="message-content">
                    <div class="message-bubble">
                        พร้อมใช้งาน — พิมพ์ help เพื่อดูคำสั่ง หรือถามเกี่ยวกับ threat ที่กำลังเกิดขึ้นได้เลยครับ
                    </div>
                    <div class="message-time">Just now</div>
                </div>
            </div>
        </div>

        <!-- แถบด้านล่าง -->
        <div class="chat-bottom">
            <div class="suggestion-tags">
                <button class="tag-btn">critical</button>
                <button class="tag-btn">ddos</button>
                <button class="tag-btn">top sources</button>
                <button class="tag-btn">status</button>
            </div>
            
            <div class="input-container">
                <input type="text" id="aiInput" placeholder="Type your message..." autocomplete="off">
                <button id="sendBtn" class="send-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- เรียกใช้สคริปต์ภายนอก -->
    <script src="chatbot.js"></script>
</body>
</html>
