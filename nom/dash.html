<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberwatch SOC</title>
    <link rel="stylesheet" href="dash.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Library สำหรับเรนเดอร์ 3D Globe -->
    <script src="https://unpkg.com/globe.gl"></script>
</head>
<body>
    
    <div class="app-layout">

        <!-- Dashboard ฝั่งซ้าย -->
        <div class="main-dashboard">
            
            <header class="header">
                <div class="logo">
                    <span class="dot red-dot"></span> Cyber Attack Dashboard
                </div>
                <div class="status-indicators">
                    <span class="time" id="live-clock">00:00:00 ICT</span>
                </div>
            </header>

            <div class="dashboard-grid">
                
                <div class="left-panel">
                    <div class="card">
                        <div class="card-title">ATTACKS TODAY</div>
                        <div class="kpi-value red-text">510</div>
                        
                    </div>
                    <div class="card">
                        <div class="card-title">BLOCKED</div>
                        <div class="kpi-value blue-text">372</div>
                        
                    </div>
                    <div class="card">
                        <div class="card-title">CRITICAL ACTIVE</div>
                        <div class="kpi-value red-text">5</div>
                        
                    </div>
                    <!-- Exfiltration Channels -->
                    <div class="panel right-panel-card">
                        <div class="card-title">Exfiltration Channels (Destination Ports)</div>
                        <div class="port-legend" id="portLegengContainer"></div>
                    </div>
                    <div class="card">
                        <div class="card-title" style="margin-bottom: 15px; color: #64748b;">TOP SOURCE COUNTRIES</div>
                        <div id="topCountriesList"></div>
                    </div>
                </div>

                <div class="center-panel">
                    <div class="top-row">
                        <!-- 🌟 การ์ดลูกโลก 3D (จำกัดขนาดแทนที่กรอบเดิม) -->
                        <div class="card map-card" style="display: flex; flex-direction: column; overflow: hidden; position: relative;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; flex-shrink: 0;">
                                <div class="card-title" style="margin: 0;">GLOBAL THREAT GLOBE 3D</div>
                                <button id="expandGlobeBtn" title="Expand Globe" style="background: rgba(6, 182, 212, 0.1); border: 1px solid var(--color-cyan); color: var(--color-cyan); border-radius: 4px; cursor: pointer; padding: 2px 8px; font-size: 10px;">Fullscreen</button>
                            </div>
                            <!-- กล่องครอบลูกโลกให้อยู่ตรงกลาง -->
                            <div id="globeContainer" style="flex: 1; width: 100%; height: 100%; overflow: hidden; position: relative; border-radius: 4px; background: #050811; display: flex; justify-content: center; align-items: center;"></div>
                        </div>

                        <!-- 🌟 การ์ด ATTACK TYPES (กลับมาอยู่ทางขวา) -->
                        <div class="card chart-card">
                            <div class="card-title">ATTACK TYPES</div>
                            <div class="chart-container">
                                <canvas id="attackTypeChart"></canvas>
                            </div>
                        </div>
                    </div>

                    <div class="card volume-card">
                        <div class="card-title">ATTACK VOLUME - LAST 24H</div>
                        <div class="chart-container-bar">
                            <canvas id="attackVolumeChart"></canvas>
                        </div>
                    </div>

                    <div class="card table-card">
                        <div class="table-header-filters">
                            <span>FILTER:</span>
                            <button class="filter-btn active" data-filter="ALL">ALL</button>
                            <button class="filter-btn" data-filter="CRITICAL">CRITICAL</button>
                            <button class="filter-btn" data-filter="HIGH">HIGH</button>
                            <button class="filter-btn" data-filter="MEDIUM">MEDIUM</button>
                            <button class="filter-btn" data-filter="LOW">LOW</button>
                            <span id="event-count" style="margin-left: auto; font-size: 10px; color: #64748b;">0 events</span>
                        </div>

                        <table class="events-table">
                            <thead>
                                <tr>
                                    <th>TIME</th>
                                    <th>SRC IP</th>
                                    <th>CC</th>
                                    <th>DST IP</th>
                                    <th>TYPE</th>
                                    <th>SEV</th>
                                    <th>PORT</th>
                                    <th>STATUS</th>
                                    <th style="text-align: right;">PKTS</th>
                                </tr>
                            </thead>
                            <tbody id="eventsTableBody">
                                <!-- ข้อมูลจาก JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>

        <!-- หน้าต่าง Chatbot -->
        <iframe src="chatbot.html" id="chatbot-iframe"></iframe>

    </div>

    <!-- Modal ขยายลูกโลก 3D -->
    <div id="globeModal" class="globe-modal">
        <span class="close-modal" id="closeGlobeModal">&times;</span>
        <div id="modalGlobeContainer"></div>
    </div>
    <script src="dash.js"></script>
</body>
</html>
